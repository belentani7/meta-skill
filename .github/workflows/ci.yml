name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (compilar, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compilar todo el codigo fuente
        run: python -m compileall -q .
      - name: Tests
        run: pytest -q
      - name: Validate model catalog and routing evaluation
        run: |
          python meta-skill/scripts/update_models.py --validate
          python meta-skill/scripts/evaluate_router.py
          python -m unittest discover -s evaluation-lab/tests -v
      - name: Frontend clipboard tests (Node built-in runner)
        run: node --test tests/docs-site.test.cjs
