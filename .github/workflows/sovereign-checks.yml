name: Sovereign checks
on:
  pull_request:
  push:
    branches: [feat/sovereign-constitutional-guard]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_sovereign*.py' -v
